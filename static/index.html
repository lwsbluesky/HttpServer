<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HttpServer</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dce4ef;--brand:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei",sans-serif}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#dbeafe,#f8fafc)}.loginbox,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 28px #223c6411}.loginbox{width:380px;padding:36px}.loginbox h1{margin:0}.loginbox p,.muted{color:var(--muted)}.input{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;outline:0}.loginbox .input{width:100%;margin:7px 0}.btn{border:0;border-radius:9px;background:var(--brand);color:#fff;padding:10px 14px;cursor:pointer;font-weight:600}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#dc2626}.loginbox .btn{width:100%;margin-top:10px}.shell{display:flex;min-height:100vh;position:relative}.side{width:235px;background:#101827;color:#d8e0ed;padding:25px 15px}.logo{font-size:22px;font-weight:800;color:#fff;padding:0 10px 28px}.logo span{color:#60a5fa}.nav{padding:12px;border-radius:10px;margin:4px 0;cursor:pointer}.nav.active{background:#2453d4;color:#fff}.user-panel{position:absolute;top:25px;right:38px;text-align:right;z-index:10}.user-panel .welcome{font-size:16px;font-weight:700;margin-bottom:6px;color:var(--ink)}.main{flex:1;max-width:1450px;padding:28px 38px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1,.top h2{margin:0}.bar{display:flex;gap:9px;margin-bottom:15px}.search{flex:1}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-weight:600}.name{font-weight:600;cursor:pointer}.actions{display:flex;gap:6px;justify-content:flex-end}.empty{text-align:center;color:var(--muted);padding:60px}.crumb{color:var(--brand);cursor:pointer}.paging{padding-top:15px;display:flex;justify-content:space-between;align-items:center}.modal{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:4vh}.modal.hidden{display:none}.modalbox{width:min(900px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:20px}.modalhead{position:sticky;top:-20px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px;z-index:2}.modalbox pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:16px;border-radius:9px}.formrow{display:flex;gap:10px;margin:10px 0}.formrow .input{flex:1}.rootrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.rootrow .input{flex:1}@media(max-width:760px){.side{width:70px}.logo{font-size:0}.logo span{font-size:20px}.nav{font-size:0}.main{padding:18px 10px}.table{font-size:12px}.table th:nth-child(2),.table td:nth-child(2){display:none}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"><div class="modalbox" onclick="event.stopPropagation()"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn secondary" onclick="closeModal()">关闭</button></div><div id="modalBody"></div></div></div><script>
const app=document.querySelector('#app'),modal=document.querySelector('#modal'),modalTitle=document.querySelector('#modalTitle'),modalBody=document.querySelector('#modalBody');let state={page:'files',path:'',q:'',pageNo:1,pageSize:20};
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+(localStorage.token||'')}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'请求失败');return d}function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function fmt(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(1)+' GB'}
function login(){app.innerHTML=`<div class=login><div class=loginbox><h1>Http<span style="color:#2563eb">Server</span></h1><p>文件共享登录</p><input id=un class=input placeholder=用户名><input id=pw class=input type=password placeholder=密码 onkeydown="if(event.key==='Enter')doLogin()"><button class=btn onclick=doLogin()>登录</button></div></div>`}async function doLogin(){try{let d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:un.value,password:pw.value})});localStorage.token=d.token;localStorage.user=JSON.stringify(d.user);render()}catch(e){alert(e.message)}}function logout(){localStorage.clear();location.href='/login'}
function headerUserHtml(){let u=JSON.parse(localStorage.user||'{}');return`<div class="user-panel"><div class="welcome">欢迎您：${esc(u.username)}</div><div><button class="btn secondary" style="padding:6px 14px;font-size:13px;" onclick=logout()>退出登录</button></div></div>`}
async function render(){let u=JSON.parse(localStorage.user||'{}');app.innerHTML=`<div class=shell><aside class=side><div class=logo>Http<span>Server</span></div><div class="nav ${state.page==='files'?'active':''}" onclick="state.page='files';render()">▦ 文件浏览</div>${u.role==='admin'?`<div class="nav ${state.page==='admin'?'active':''}" onclick="state.page='admin';render()">⚙ 管理中心</div>`:''}</aside>${headerUserHtml()}<main class=main id=main></main></div>`;if(state.page==='admin')admin();else files()}
function crumbs(){let p=state.path.split('/').filter(Boolean);if(!p.length)return'<span class=crumb onclick="state.path=\'\';state.q=\'\';state.pageNo=1;files()">共享根目录</span>';let out='<span class=crumb onclick="state.path=\'\';state.q=\'\';state.pageNo=1;files()">共享根目录</span>';for(let i=0;i<p.length;i++)out+=` / <span class=crumb onclick="state.path='${p.slice(0,i+1).join('/')}';state.q='';state.pageNo=1;files()">${i===1?'共享目录':esc(p[i])}</span>`;return out}
async function files(){let d=await api('/api/files?path='+encodeURIComponent(state.path)+'&q='+encodeURIComponent(state.q));let pages=Math.max(1,Math.ceil(d.items.length/state.pageSize));state.pageNo=Math.min(Math.max(1,state.pageNo),pages);let start=(state.pageNo-1)*state.pageSize,items=d.items.slice(start,start+state.pageSize),u=JSON.parse(localStorage.user);main.innerHTML=`<div class=top><div><h1>文件浏览</h1><div class=muted>安全、快速地访问共享内容</div></div></div><div class=bar><input id=search class="input search" value="${esc(state.q)}" placeholder="搜索文件名，支持 * 和 ? 通配符" onkeydown="if(event.key==='Enter')searchFiles()"><button class=btn onclick=searchFiles()>搜索</button><button class="btn secondary" onclick="state.q='';state.pageNo=1;files()">清除</button></div><div class=card style="padding:16px"><div style="margin-bottom:12px">${crumbs()}<span class=muted style="float:right">${d.items.length} 项</span></div><table class=table><thead><tr><th>名称</th><th>路径</th><th>大小</th><th>类型</th><th>修改时间</th><th style="text-align:right">操作</th></tr></thead><tbody>${items.map(x=>`<tr><td class=name onclick="${x.type==='folder'?`openFolder('${x.path}')`:x.can_view?`viewFile('${x.path}')`:''}">${x.type==='folder'?'📁':'📄'} ${esc(x.name)}</td><td class=muted>${esc(x.path)}</td><td>${x.type==='folder'?'-':fmt(x.size)}</td><td>${x.type==='folder'?'文件夹':esc(x.extension||'文件')}</td><td>${new Date(x.modified*1000).toLocaleString()}</td><td><div class=actions>${u.role==='admin'?`<button class="btn secondary" onclick="hideFile('${x.path}')">${x.hidden?'取消隐藏':'隐藏'}</button>`:''}${x.can_view?`<button class="btn secondary" onclick="viewFile('${x.path}')">浏览</button>`:''}<button class=btn onclick="download('${x.path}')">${x.type==='folder'?'打包下载':'下载'}</button></div></td></tr>`).join('')||`<tr><td colspan=6 class=empty>${state.q?'没有查找到文件':'这里还没有文件'}</td></tr>`}</tbody></table><div class=paging><span class=muted>第 ${state.pageNo} / ${pages} 页</span><div><select class=input onchange="state.pageSize=+this.value;state.pageNo=1;files()"><option ${state.pageSize===20?'selected':''}>20</option><option ${state.pageSize===50?'selected':''}>50</option><option ${state.pageSize===100?'selected':''}>100</option></select> <button class="btn secondary" ${state.pageNo===1?'disabled':''} onclick="if(state.pageNo>1){state.pageNo--;files()}">上一页</button> <button class="btn secondary" ${state.pageNo===pages?'disabled':''} onclick="if(state.pageNo<${pages}){state.pageNo++;files()}">下一页</button></div></div></div>`}
function openFolder(p){state.path=p;state.q='';state.pageNo=1;files()}function searchFiles(){state.q=search.value.trim();state.pageNo=1;files()}function download(p){let a=document.createElement('a');a.href='/api/files/download?path='+encodeURIComponent(p)+'&token='+encodeURIComponent(localStorage.token);a.download='';document.body.append(a);a.click();a.remove()}async function viewFile(p){let d=await api('/api/files/view?path='+encodeURIComponent(p));if(d.content!==undefined){modalTitle.textContent=d.name;modalBody.innerHTML='<pre>'+esc(d.content)+'</pre>';modal.classList.remove('hidden')}else window.open('/api/files/view?path='+encodeURIComponent(p)+'&token='+encodeURIComponent(localStorage.token),'_blank')}async function hideFile(p){await api('/api/files/hidden?path='+encodeURIComponent(p),{method:'POST'});files()}function closeModal(){modal.classList.add('hidden')}modal.onclick=closeModal;
async function admin(){let [users,roots]=await Promise.all([api('/api/admin/users'),api('/api/admin/share-roots')]);let customRoots=roots.filter(r=>r.id!==1);main.innerHTML=`<div class=top><div><h1>管理中心</h1><div class=muted>用户权限和共享目录设置</div></div><button class=btn onclick="userEditor()">＋ 新建用户</button></div><div class=card style="padding:16px"><h2>用户与权限</h2><table class=table><thead><tr><th>账号</th><th>角色</th><th>浏览</th><th>下载</th><th style="text-align:right">操作</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${u.role}</td><td>${u.can_browse?'允许':'禁止'}</td><td>${u.can_download?'允许':'禁止'}</td><td class=actions><button class="btn secondary" onclick="userEditor(${u.id})">编辑</button>${u.role!=='admin'?`<button class="btn danger" onclick="deleteUser(${u.id})">删除</button>`:''}</td></tr>`).join('')}</tbody></table></div><div class=card style="padding:16px;margin-top:16px"><h2>共享目录</h2><p class=muted>添加和扩展其他需要在系统内共享的本地文件夹。</p><div class=bar><input id=rootName class=input placeholder="显示名称"><input id=rootPath class="input search" placeholder="例如 D:\\软件包"><button class=btn onclick=addRoot()>添加目录</button></div>${customRoots.map(r=>`<div class=rootrow><input id="rn${r.id}" class=input value="${esc(r.name)}"><input id="rp${r.id}" class=input value="${esc(r.path)}"><button class="btn secondary" onclick="saveRoot(${r.id})">保存目录</button><button class="btn danger" onclick="deleteRoot(${r.id})">移除</button></div>`).join('')}</div>`}
async function userEditor(id){let users=await api('/api/admin/users'),u=id?users.find(x=>x.id===id):{username:'',password:'',role:'user',can_browse:true,can_download:true};modalTitle.textContent=id?'编辑用户':'新建用户';modalBody.innerHTML=`<div class=formrow><input id=eu class=input placeholder=用户名 value="${esc(u.username)}"><input id=ep class=input placeholder=密码 value="${esc(u.password)}"></div><p><label><input id=eb type=checkbox ${u.can_browse?'checked':''}> 允许浏览</label> <label><input id=ed type=checkbox ${u.can_download?'checked':''}> 允许下载</label></p><button class=btn onclick="saveUser(${id||0},'${u.role}')">保存</button>`;modal.classList.remove('hidden')}async function saveUser(id,role){let body={username:eu.value.trim(),password:ep.value,role:role||'user',can_browse:eb.checked,can_download:ed.checked};try{await api(id?'/api/admin/users/'+id:'/api/admin/users',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});closeModal();admin()}catch(e){alert(e.message)}}async function deleteUser(id){if(confirm('确认删除用户？')){await api('/api/admin/users/'+id,{method:'DELETE'});admin()}}async function addRoot(){try{await api('/api/admin/share-roots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rootName.value,path:rootPath.value})});admin()}catch(e){alert(e.message)}}async function saveRoot(id){try{await api('/api/admin/share-roots/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#rn'+id).value,path:document.querySelector('#rp'+id).value})});admin()}catch(e){alert(e.message)}}async function deleteRoot(id){if(confirm('确认移除此共享目录？')){await api('/api/admin/share-roots/'+id,{method:'DELETE'});admin()}}
localStorage.token?render():login();
</script></body></html>
